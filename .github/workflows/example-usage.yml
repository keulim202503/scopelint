name: ScopeLint Example

# 이 워크플로는 사용법 예시입니다. 실제 프로젝트에서는
# PR 본문이나 이슈 제목 등 원래 요청한 작업 설명을 task 입력으로 넘기세요.
on:
  workflow_dispatch:

jobs:
  check-scope-creep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff against requested task scope
        uses: ./
        with:
          task: ${{ github.event.pull_request.title }}
          working-directory: '.'
